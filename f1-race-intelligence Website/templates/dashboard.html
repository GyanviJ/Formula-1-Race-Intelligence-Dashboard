
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formula 1 Race Intelligence Dashboard</title>

    <!-- Tableau Embedding API -->
    <script
        type="module"
        src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #111111;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 14px 10px;
            text-align: center;
            background-color: #111111;
        }

        h1 {
            margin: 0;
            color: #e10600;
            font-size: clamp(22px, 3vw, 34px);
        }

        .dashboard-container {
            width: 100%;
            padding: 8px;
            margin: 0 auto;
        }

        tableau-viz {
            display: block;
            width: 100%;
            height: 82vh;
            min-height: 650px;
            border: none;
        }

        footer {
            padding: 10px;
            text-align: center;
            color: #aaaaaa;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Formula 1 Race Intelligence Dashboard</h1>
    </header>

    <main class="dashboard-container">
        <tableau-viz
            id="f1Dashboard"
            src="https://public.tableau.com/views/gyanvi_25Oct26_6pm/Dashboard2?:language=en-US&:sid=&:redirect=auth&publish=yes&showOnboarding=true&:display_count=n&:origin=viz_share_link"
            toolbar="bottom"
            hide-tabs
            width="100%"
            height="800">
        </tableau-viz>
    </main>

    <footer>
        Formula 1 Race Intelligence | Interactive Data Visualization
    </footer>
</body>
</html>
